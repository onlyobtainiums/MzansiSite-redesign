<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Background circle with orange-red gradient -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff5500"/>
      <stop offset="100%" stop-color="#e03200"/>
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>

  <!-- M mountain shape -->
  <path
    d="M30 138 L62 82 L100 118 L138 82 L170 138"
    stroke="white"
    stroke-width="22"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Sunrise rays above M center peak -->
  <line x1="100" y1="52" x2="100" y2="36" stroke="white" stroke-width="10" stroke-linecap="round"/>
  <line x1="82"  y1="57" x2="74"  y2="43" stroke="white" stroke-width="10" stroke-linecap="round"/>
  <line x1="118" y1="57" x2="126" y2="43" stroke="white" stroke-width="10" stroke-linecap="round"/>
</svg>
